name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            py: '3.11'
          - os: macos-latest
            py: '3.11'
          - os: ubuntu-latest
            py: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # macOS: 在 arm64 runner 上用 Rosetta 交叉编译 x86_64，再合并为 universal2
      - name: Build universal2 (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          # 1) 安装 x86_64 Python（universal2 安装包，可经 Rosetta 以 x86_64 运行）
          curl -sLO https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg
          sudo installer -pkg python-3.11.9-macos11.pkg -target /
          X86_PY=/Library/Frameworks/Python.framework/Versions/3.11/bin/python3
          arch -x86_64 "$X86_PY" -m pip install -U pip
          # 强制拉 x86_64 轮子，否则 arm64 机器上 pip 默认装 arm64 包，PyInstaller 会报架构不兼容
          arch -x86_64 "$X86_PY" -m pip install --platform macosx_10_9_x86_64 --only-binary=:all: -r requirements.txt pyinstaller

          # 2) 构建 x86_64
          arch -x86_64 "$X86_PY" build.py
          mv dist/KnightModder dist/KnightModder-x86_64
          rm -rf build dist

          # 3) 构建 arm64（原生）
          python build.py
          mv dist/KnightModder dist/KnightModder-arm64

          # 4) 合并 + 签名
          lipo -create dist/KnightModder-arm64 dist/KnightModder-x86_64 -output dist/KnightModder-macos
          codesign --force --options runtime --sign - --entitlements entitlements.plist dist/KnightModder-macos
          file dist/KnightModder-macos

      - name: Rename (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mv dist/KnightModder dist/KnightModder-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnightModder-${{ matrix.os }}
          path: |
            dist/KnightModder.exe
            dist/KnightModder-macos
            dist/KnightModder-linux
          if-no-files-found: ignore

  release:
    needs: build
    # 仅在有 tag 的推送时自动建 Release（手动触发只产出 artifact）
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: KnightModder-*
          merge-multiple: true

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p upload
          [ -f artifacts/KnightModder.exe ]    && cp artifacts/KnightModder.exe    upload/KnightModder-windows.exe
          [ -f artifacts/KnightModder-macos ]  && cp artifacts/KnightModder-macos  upload/KnightModder-macos
          [ -f artifacts/KnightModder-linux ]  && cp artifacts/KnightModder-linux  upload/KnightModder-linux
          ls -la upload

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
