name: Build (Windows)

on:
  # 只在推 tag 时构建并发布 Release；推 main 不再触发，避免产生无 Release 的冗余构建。
  # 需要手动构建时用 workflow_dispatch。
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build single-file executable (PyInstaller)
        run: pyinstaller --noconfirm main.spec

      - name: Rename artifact
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          $exe = Get-Item dist\KnightModder* | Select-Object -First 1
          $ext = $exe.Extension
          Rename-Item $exe.FullName -NewName "KnightModder-v$ver-windows$ext"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnightModder-Windows
          path: |
            dist/KnightModder*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          remove: true
          generate_release_notes: true
