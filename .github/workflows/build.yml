name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            py: '3.11'
          - os: macos-latest        # Apple Silicon (arm64)
            py: '3.11'
            mac_arch: arm64
          - os: macos-13            # Intel (x86_64)
            py: '3.11'
            mac_arch: x86_64
          - os: ubuntu-latest
            py: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: python build.py

      - name: Sign + rename (macOS)
        if: matrix.mac_arch != ''
        shell: bash
        run: |
          codesign --force --options runtime --sign - --entitlements entitlements.plist dist/KnightModder
          mv dist/KnightModder dist/KnightModder-macos-${{ matrix.mac_arch }}

      - name: Rename (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mv dist/KnightModder dist/KnightModder-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnightModder-${{ matrix.os }}
          path: |
            dist/KnightModder.exe
            dist/KnightModder-macos-arm64
            dist/KnightModder-macos-x86_64
            dist/KnightModder-linux
          if-no-files-found: ignore

  # 合并两个 macOS 架构为 universal2（需在 macOS runner 上用 lipo）
  merge-macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KnightModder-macos-latest
          path: mac-arm64
      - uses: actions/download-artifact@v4
        with:
          name: KnightModder-macos-13
          path: mac-x86_64
      - name: Lipo universal2
        run: |
          lipo -create mac-arm64/KnightModder-macos-arm64 mac-x86_64/KnightModder-macos-x86_64 -output KnightModder-macos
          codesign --force --options runtime --sign - --entitlements entitlements.plist KnightModder-macos
          file KnightModder-macos
      - uses: actions/upload-artifact@v4
        with:
          name: KnightModder-macos-universal
          path: KnightModder-macos

  release:
    needs: [build, merge-macos]
    # 仅在有 tag 的推送时自动建 Release（手动触发只产出 artifact）
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: KnightModder-*
          merge-multiple: true

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p upload
          [ -f artifacts/KnightModder.exe ]    && cp artifacts/KnightModder.exe    upload/KnightModder-windows.exe
          [ -f artifacts/KnightModder-macos ]  && cp artifacts/KnightModder-macos  upload/KnightModder-macos
          [ -f artifacts/KnightModder-linux ]  && cp artifacts/KnightModder-linux  upload/KnightModder-linux
          ls -la upload

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
