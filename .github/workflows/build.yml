name: 构建安装包

# 推送到 main：构建一次，产物放 Artifacts。
# 推送 v* 标签：构建并发布成 Release（两个 exe 作为附件）。
# 也可以在 Actions 页面手动点「Run workflow」。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write    # 创建 Release 需要写仓库内容的权限，默认可能只有读
    env:
      # Windows runner 的控制台默认是 cp1252，Python 打印中文进度提示会直接
      # UnicodeEncodeError 把构建打断。强制用 UTF-8 读写标准流。
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content version.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "版本: $v"

      # 绿色单文件版：dist/KnightModder v<版本> 绿色版.exe
      - name: 构建绿色版
        run: pyinstaller --noconfirm main.spec

      # 安装版：内部先跑 onedir，再压成 payload，最后打成单文件安装器
      # 产出 dist/KnightModder v<版本> 安装版.exe
      - name: 构建安装版
        run: python build_installer.py

      - name: 列出产物
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe |
            ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length/1MB) }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: KnightModder-v${{ steps.ver.outputs.version }}
          path: dist/*.exe
          if-no-files-found: error

      # 只有打 v* 标签时才发 Release，免得每次 push 都生成一个发布版本。
      #
      # 这里用 runner 自带的 GitHub CLI（gh），而不是 softprops/action-gh-release：
      # 后者在附件文件名含空格时会多做一步「Restoring asset label」，去 PATCH
      # /releases/assets/{id}，结果 404 Not Found 让整个 job 失败——而我们的 exe
      # 恰恰就叫「KnightModder v1.4.5 绿色版.exe」这种带空格的名字。
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $j = Get-Content version.json -Raw | ConvertFrom-Json
          $files = (Get-ChildItem dist -Filter *.exe).FullName
          if (-not $files) { throw "dist 下没有找到 exe，无法发布 Release" }

          # 同一个 tag 重跑时先清掉旧 Release。注意 GitHub 的 pwsh 会把
          # $ErrorActionPreference 设成 Stop，而 gh 在目标不存在时会返回非零
          # 直接把脚本终止——所以这里只看退出码，不靠 stderr 重定向兜。
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes
            if ($LASTEXITCODE -ne 0) { throw "删除旧 Release 失败" }
          }

          # 刚推上来的 tag 在 GitHub 侧可能还没同步完（之前用 softprops 时日志里
          # 就出现过 "Release is not yet discoverable by tag"），gh 会报 tag not
          # found。所以失败后等几秒重试；若其实已经建好了（view 查得到）也算成功。
          $ok = $false
          for ($i = 1; $i -le 5; $i++) {
            gh release create $tag --title "KnightModder v$($j.version)" `
              --notes "$($j.changelog)" $files
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Release 已存在，视为成功"
              $ok = $true
              break
            }
            Write-Host "第 $i 次发布未成功，5 秒后重试"
            Start-Sleep -Seconds 5
          }
          if (-not $ok) { throw "发布 Release 失败（已重试 5 次）" }

          gh release view $tag
