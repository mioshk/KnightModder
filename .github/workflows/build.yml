name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            py: '3.11'
          - os: macos-latest
            py: '3.11'
          - os: ubuntu-latest
            py: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # macOS: 同时构建 arm64 + x86_64，合并为 universal2（兼容 Intel 与 Apple Silicon）
      - name: Build universal2 (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          # 构建 arm64（原生，当前 runner 即 arm64）
          python build.py
          mv dist/KnightModder dist/KnightModder-arm64
          rm -rf build dist

          # 构建 x86_64（Rosetta 交叉编译）
          arch -x86_64 /usr/bin/python3 build.py
          mv dist/KnightModder dist/KnightModder-x86_64

          # 合并为 universal2 二进制
          lipo -create dist/KnightModder-arm64 dist/KnightModder-x86_64 -output dist/KnightModder-macos
          codesign --force --options runtime --sign - --entitlements entitlements.plist dist/KnightModder-macos
          file dist/KnightModder-macos

      - name: Build (Windows / Linux)
        if: matrix.os != 'macos-latest'
        run: python build.py

      - name: Rename per platform
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            mv dist/KnightModder dist/KnightModder-linux
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnightModder-${{ matrix.os }}
          path: |
            dist/KnightModder.exe
            dist/KnightModder-macos
            dist/KnightModder-linux
          if-no-files-found: ignore

  release:
    needs: build
    # 仅在有 tag 的推送时自动建 Release（手动触发只产出 artifact）
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: KnightModder-*
          merge-multiple: true

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p upload
          [ -f artifacts/KnightModder.exe ]    && cp artifacts/KnightModder.exe    upload/KnightModder-windows.exe
          [ -f artifacts/KnightModder-macos ]  && cp artifacts/KnightModder-macos  upload/KnightModder-macos
          [ -f artifacts/KnightModder-linux ]  && cp artifacts/KnightModder-linux  upload/KnightModder-linux
          ls -la upload

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
