name: Build (Windows / macOS / Linux)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: KnightModder-Windows
          - os: macos-latest
            artifact: KnightModder-macOS
          - os: ubuntu-latest
            artifact: KnightModder-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate macOS icon (.icns)
        if: runner.os == 'macOS'
        run: |
          mkdir -p assets/icon.iconset
          sips -z 16 16     assets/icon.png --out assets/icon.iconset/icon_16x16.png
          sips -z 32 32     assets/icon.png --out assets/icon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/icon.png --out assets/icon.iconset/icon_32x32.png
          sips -z 64 64     assets/icon.png --out assets/icon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/icon.png --out assets/icon.iconset/icon_128x128.png
          sips -z 256 256   assets/icon.png --out assets/icon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/icon.png --out assets/icon.iconset/icon_256x256.png
          sips -z 512 512   assets/icon.png --out assets/icon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/icon.png --out assets/icon.iconset/icon_512x512.png
          sips -z 1024 1024 assets/icon.png --out assets/icon.iconset/icon_512x512@2x.png
          iconutil -c icns assets/icon.iconset -o assets/icon.icns

      - name: Read version from config.py
        id: version
        run: |
          VERSION=$(python -c "import re; f=open('config.py'); t=f.read(); f.close(); m=re.search(r'APP_VERSION\s*=\s*[\"\'']([^\"\'']+)[\"\'']', t); print(m.group(1) if m else '0.0.0')")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Read version: $VERSION"
        shell: bash

      - name: Build single-file executable (PyInstaller)
        run: pyinstaller --noconfirm main.spec

      - name: Rename artifact by platform (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-Item dist\KnightModder* | Select-Object -First 1
          $ext = $exe.Extension
          Rename-Item $exe.FullName -NewName "KnightModder-v${{ steps.version.outputs.version }}-windows$ext"

      - name: Rename artifact by platform (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          PLATFORM="${{ runner.os }}"  # macOS or Linux
          FILE=$(ls dist/KnightModder* | head -1)
          EXT="${FILE##*.}"
          if [ "$EXT" != "$FILE" ]; then
            mv "$FILE" "dist/KnightModder-v${{ steps.version.outputs.version }}-${PLATFORM,,}.$EXT"
          else
            mv "$FILE" "dist/KnightModder-v${{ steps.version.outputs.version }}-${PLATFORM,,}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/KnightModder*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          remove: true
          generate_release_notes: true
