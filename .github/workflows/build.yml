name: 构建安装包

# 推送到 main：构建一次，产物放 Artifacts。
# 推送 v* 标签：构建并发布成 Release（两个 exe 作为附件）。
# 也可以在 Actions 页面手动点「Run workflow」。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write    # 创建 Release 需要写仓库内容的权限，默认可能只有读
    env:
      # Windows runner 的控制台默认是 cp1252，Python 打印中文进度提示会直接
      # UnicodeEncodeError 把构建打断。强制用 UTF-8 读写标准流。
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content version.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "版本: $v"

      # 绿色单文件版：dist/KnightModder v<版本> 绿色版.exe
      - name: 构建绿色版
        run: pyinstaller --noconfirm main.spec

      # 安装版：内部先跑 onedir，再压成 payload，最后打成单文件安装器
      # 产出 dist/KnightModder v<版本> 安装版.exe
      - name: 构建安装版
        run: python build_installer.py

      - name: 校验产物（安装版 + 绿色版必须都在）
        shell: pwsh
        run: |
          $install = Get-ChildItem dist -Filter "KnightModder v* 安装版.exe" -File
          $green   = Get-ChildItem dist -Filter "KnightModder v* 绿色版.exe" -File
          if (-not $install) { throw "缺少安装版 exe：dist/KnightModder v* 安装版.exe" }
          if (-not $green)   { throw "缺少绿色版 exe：dist/KnightModder v* 绿色版.exe" }
          Get-ChildItem dist -Filter *.exe |
            ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length/1MB) }

      # 分成两个 artifact，而不是把两个 exe 塞进同一个 zip：
      # GitHub 的 artifact 一个就是一个 zip，混在一起会让人误以为「只构建了一个」
      # 且不知道是哪个版本；拆开后各自 ~50MB，名字直接写明安装版 / 绿色版。
      - name: 上传安装版
        uses: actions/upload-artifact@v4
        with:
          name: KnightModder-v${{ steps.ver.outputs.version }}-安装版
          path: dist/KnightModder v* 安装版.exe
          if-no-files-found: error

      - name: 上传绿色版
        uses: actions/upload-artifact@v4
        with:
          name: KnightModder-v${{ steps.ver.outputs.version }}-绿色版
          path: dist/KnightModder v* 绿色版.exe
          if-no-files-found: error

      # 只有打 v* 标签时才发 Release，免得每次 push 都生成一个发布版本。
      #
      # 附件名必须「无空格 + 纯 ASCII」：GitHub 的 assets 上传接口遇到带空格 /
      # 中文的 name 会返回 404 Not Found——失败日志里就是
      # uploads.github.com/repos/.../releases/<id>/assets?label=... 这种 404。
      # 本地产物偏偏叫「KnightModder v1.4.10 绿色版.exe」（两个空格 + 中文），
      # 所以无论用 softprops（PATCH /releases/assets/{id} 404）还是 gh（上传 404）
      # 都会踩。这里先把两个 exe 复制成安全名字，再分两步「建 Release → 传附件」。
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $j = Get-Content version.json -Raw | ConvertFrom-Json

          # 复制成无空格、纯 ASCII 的附件名
          $stage = Join-Path $env:RUNNER_TEMP "release-assets"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $install = Get-ChildItem dist -Filter "*安装版.exe" -File | Select-Object -First 1
          $green   = Get-ChildItem dist -Filter "*绿色版.exe" -File | Select-Object -First 1
          if (-not $install) { throw "缺少安装版 exe" }
          if (-not $green)   { throw "缺少绿色版 exe" }

          $setup    = Join-Path $stage "KnightModder-v$($j.version)-setup.exe"
          $portable = Join-Path $stage "KnightModder-v$($j.version)-portable.exe"
          Copy-Item $install.FullName $setup    -Force
          Copy-Item $green.FullName   $portable -Force
          $files = @($setup, $portable)

          # 同一个 tag 重跑时先清掉旧 Release。注意 GitHub 的 pwsh 会把
          # $ErrorActionPreference 设成 Stop，而 gh 在目标不存在时会返回非零
          # 直接把脚本终止——所以这里只看退出码，不靠 stderr 重定向兜。
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes
            if ($LASTEXITCODE -ne 0) { throw "删除旧 Release 失败" }
          }

          # 第一步：只建 Release（不带附件）。比 create 时直接带附件稳——带附件
          # 上传失败时 gh 会回滚重建，失败日志里 releases/<id> 一直变就是这么来的。
          # 刚推上来的 tag 在 GitHub 侧可能还没同步完（之前用 softprops 时日志里
          # 就出现过 "Release is not yet discoverable by tag"），gh 会报 tag not
          # found。所以失败后等几秒重试；若其实已经建好了（view 查得到）也算成功。
          $ok = $false
          for ($i = 1; $i -le 5; $i++) {
            gh release create $tag --title "KnightModder v$($j.version)" `
              --notes "$($j.changelog)"
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Release 已存在，视为成功"
              $ok = $true
              break
            }
            Write-Host "第 $i 次创建 Release 未成功，5 秒后重试"
            Start-Sleep -Seconds 5
          }
          if (-not $ok) { throw "创建 Release 失败（已重试 5 次）" }

          # 第二步：单独上传附件；--clobber 让同 tag 重跑能覆盖旧附件
          gh release upload $tag $files --clobber
          if ($LASTEXITCODE -ne 0) { throw "上传 Release 附件失败" }

          gh release view $tag
